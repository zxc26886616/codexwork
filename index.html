<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Drift</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Signal Drift game">
      <section class="playfield">
        <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>
        <div class="hud" aria-hidden="true">
          <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Combo</span>
            <strong id="combo">x1</strong>
          </div>
          <div class="stat">
            <span>Hull</span>
            <strong id="lives">3</strong>
          </div>
        </div>
        <div class="overlay" id="overlay">
          <h1>Signal Drift</h1>
          <p id="overlayText">Catch signal shards. Slip past the red gates.</p>
          <button id="startButton" type="button">Start</button>
        </div>
        <div class="touch-pad" id="touchPad" aria-hidden="true">
          <div class="stick" id="stick"></div>
        </div>
      </section>
      <nav class="controls" aria-label="Game controls">
        <button id="pauseButton" type="button" title="Pause or resume">Pause</button>
        <button id="restartButton" type="button" title="Restart">Restart</button>
      </nav>
    </main>
    <script src="game.js"></script>
  </body>
</html>
